    <!-- Paper colour before any CSS loads, so a page change never flashes white -->
    <style>
      html { background: #f1ebdf; }
      html[data-theme="dark"] { background: #1c1815; }
    </style>

    <script>
      document.documentElement.classList.add("js");
      try {
        var t = localStorage.getItem("ms-theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
        var s = localStorage.getItem("ms-sound");
        if (s === "on" || s === "off") document.documentElement.dataset.sound = s;
      } catch (e) {}
    </script>

    <!-- Fonts are served from /fonts (see css/fonts.css) -->
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />

    <script src="js/transition.js" defer></script>
    <script src="js/menu.js" defer></script>
    <script src="js/terminal.js" defer></script>
    <script src="js/main.js" defer></script>
